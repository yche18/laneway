server:
  port: 8081
spring:
  application:
    name: laneway
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/laneway?useSSL=false&serverTimezone=UTC
    username: root
    password: 123
  redis:
    host: 192.168.150.101
    port: 6379
    password: 123321
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    default-property-inclusion: non_null # Omit null JSON fields
mybatis-plus:
  type-aliases-package: com.laneway.entity # Type alias scan package
logging:
  level:
    com.laneway: debug
  pattern:
    dateformat: mm:ss.SSS
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        laneway.seckill.consume: true
        laneway.cdc.event.delay: true
        laneway.mq.consume: true
        laneway.mq.send: true
        laneway.kafka.event.delay: true
  endpoint:
    health:
      show-details: never
laneway:
  reliability:
    scheduling-enabled: true
    max-deliveries: 5
    claim-idle-ms: 30000
    order-timeout-minutes: 30

  experience:
    enabled: ${LANEWAY_EXPERIENCE_ENABLED:false}
  analytics:
    enabled: ${LANEWAY_ANALYTICS_ENABLED:false}
    bootstrap-servers: ${LANEWAY_KAFKA_SERVERS:127.0.0.1:9092}
    topic: LanewayShopBehavior
    group: ${LANEWAY_KAFKA_GROUP:laneway-heat-v1}
  mq:
    enabled: ${LANEWAY_MQ_ENABLED:false}
    seckill-enabled: ${LANEWAY_MQ_SECKILL_ENABLED:false}
    nameserver: ${LANEWAY_MQ_NAMESERVER:127.0.0.1:9876}
    group-prefix: ${LANEWAY_MQ_GROUP_PREFIX:laneway}
    business-topic: LanewayBusiness
    deadline-topic: LanewayOrderDeadline
    consumer-enabled: true
    lease-seconds: 60
    relay-batch-size: 20
    send-timeout-ms: 3000
  monitor-token: ${LANEWAY_MONITOR_TOKEN:}
  cache:
    enabled: true
  memcache:
    enabled: ${LANEWAY_MEMCACHE_ENABLED:false}
    host: ${LANEWAY_MEMCACHE_HOST:127.0.0.1}
    port: ${LANEWAY_MEMCACHE_PORT:11211}
    timeout-ms: 100
  cdc:
    enabled: ${LANEWAY_CDC_ENABLED:false}
    host: ${LANEWAY_CDC_HOST:127.0.0.1}
    port: ${LANEWAY_CDC_PORT:11111}
    schema: ${LANEWAY_CDC_SCHEMA:laneway}
    destination: ${LANEWAY_CDC_DESTINATION:example}
